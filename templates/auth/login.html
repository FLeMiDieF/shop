{% extends "base.html" %}
{% block title %}Вход — California Skateshop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card form-card p-2 mt-2">
      <div class="card-body">
        <div class="text-center mb-4">
          <i class="bi bi-person-circle text-accent" style="font-size:2.5rem;"></i>
          <h2 class="fw-bold mt-2 mb-0">Вход</h2>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-medium">Имя пользователя</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium">Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
            Войти
          </button>
        </form>
        <p class="text-center mt-3 text-muted small mb-0">
          Нет аккаунта?
          <a href="{{ url_for('auth.register') }}" class="text-accent text-decoration-none fw-medium">
            Зарегистрироваться
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
