{% extends "base.html" %}
{% block title %}Вход — ShopFlask{% endblock %}

{% block content %}
<div class="form-wrap">
    <h1>Вход</h1>
    <form method="post" class="form">
        <label>Email
            <input type="email" name="email" required autofocus>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn--full">Войти</button>
    </form>
    <p class="form-footer">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
</div>
{% endblock %}
